network:
  host: "localhost"
  port: 5011

lcg:
  # Numerical Recipes ranqd1, Chapter 7.1, §An Even Quicker Generator,
  # Eq. 7.1.6 parameters from Knuth and H. W. Lewis
  # https://en.wikipedia.org/wiki/Linear_congruential_generator#Parameters_in_common_use
  multiplier: 1664525
  increment: 1013904223
  modulus: 4294967296  # 2^32

security:
  key_size: 2048
  chunk_size: 10

diffie_hellman:
  # RFC 3526, Section 3.2, 2048-bit MODP Group
  # https://datatracker.ietf.org/doc/html/rfc3526#section-3
  p: ""
  g: 2
